<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carteles de perfilería</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; font-weight: 900; color: #000; background: #fff;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .hoja { width: 297mm; height: 210mm; padding: 10mm 12mm; display: flex; flex-direction: column;
          justify-content: space-evenly; align-items: stretch; text-align: center;
          page-break-after: always; break-after: page; overflow: hidden; }
  .hoja:last-child { page-break-after: auto; break-after: auto; }
  .bloque { line-height: 1.02; text-transform: uppercase; letter-spacing: .5mm; }
  .div { border-top: 2.2mm solid #000; margin: 0 8mm; }
  .m  .bloque { font-size: 98pt; }
  .m3 .bloque { font-size: 76pt; }
  .g  .bloque { font-size: 112pt; }
  .xg .bloque { font-size: 150pt; }
  @media screen {
    body { background: #e9e9e9; padding: 8mm 0; }
    .hoja { margin: 0 auto 8mm; background: #fff; box-shadow: 0 1mm 4mm rgba(0,0,0,.25); }
  }
</style>
</head>
<body>
<section class="hoja g"><div class="bloque"><div>J-C</div><div>MINI</div><div>ALUMINIO</div></div></section>
<section class="hoja m"><div class="bloque"><div>OVAL</div><div>ALUMINIO</div></div><div class="div"></div><div class="bloque"><div>MOA</div><div>ALUMINIO</div></div></section>
<section class="hoja m3"><div class="bloque"><div>J-C</div><div>NEGRO</div></div><div class="div"></div><div class="bloque"><div>J-C</div><div>MINI</div><div>NEGRO</div></div></section>
<section class="hoja m"><div class="bloque"><div>OVAL</div><div>NEGRO</div></div><div class="div"></div><div class="bloque"><div>MOA</div><div>NEGRO</div></div></section>
<section class="hoja m"><div class="bloque"><div>INTER</div><div>NEGRO</div></div><div class="div"></div><div class="bloque"><div>SIERRA</div><div>TERRA</div></div></section>
<section class="hoja m"><div class="bloque"><div>U 18</div><div>ALUMINIO</div></div><div class="div"></div><div class="bloque"><div>MH</div><div>ALUMINIO</div></div></section>
<section class="hoja xg"><div class="bloque"><div>H</div><div>ALUMINIO</div></div></section>
<section class="hoja m"><div class="bloque"><div>TMV8</div><div>ALUMINIO</div></div><div class="div"></div><div class="bloque"><div>T18V</div><div>ALUMINIO</div></div></section>
</body>
</html>
